<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risktakers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Risktakers</h1>
  <p>Trade Deriv through Risktakers</p>

<button onclick="connectDeriv()">Connect Deriv Account</button>

<script>
function connectDeriv() {
  alert("Deriv connection will be added here.");
}
</script>

  <h2>Markets</h2>
  <div>
  <h3>Volatility 100</h3>
  <label for="symbol">Choose Volatility Index:</label>

<select id="symbol">
  <option value="R_10">Volatility 10</option>
  <option value="R_25">Volatility 25</option>
  <option value="R_50">Volatility 50</option>
  <option value="R_75">Volatility 75</option>
  <option value="R_100" selected>Volatility 100</option>
</select>

<p id="price">Loading price...</p>
    <div style="margin-top:20px;">
  <canvas id="priceChart" width="800" height="400"></canvas>
</div>
</div>
  <p>Volatility Indices</p>
  <p>Forex</p>
  <p>Commodities</p>
  <script src="app.js"></script>
  <script>
const socket = new WebSocket(
  "wss://api.derivws.com/trading/v1/options/ws/public"
);

socket.onopen = () => {
  console.log("Connected to Deriv API");
};

socket.onmessage = (event) => {
  console.log("Deriv:", event.data);
};

socket.onerror = (error) => {
  console.error("Deriv connection error:", error);
};

socket.onclose = () => {
  console.log("Deriv connection closed");
};
</script>
</body>
</html>
